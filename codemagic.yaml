# Codemagic CI/CD — Capacitor + Vite (iOS + Android)
#
# Workflows:
#   ios-release     — iOS 簽章 IPA → 自動上傳 TestFlight（用 examking_appstore API key）
#   android-aab     — Android signed .aab，丟 Play Console 上架/封閉測試
#
# 觸發：push to master 自動跑 (Codemagic 預設行為)。
#       手動可在 Dashboard "Start new build" 選 workflow。

workflows:
  ios-release:
    name: iOS Release (signed → TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: frontend
    # App Store Connect API key（Codemagic Integrations → Developer Portal 設的）
    # → 自動產發佈憑證 + 描述檔 + 上傳 TestFlight，不用手動弄 cert/profile。
    integrations:
      app_store_connect: examking_appstore
    environment:
      # CERTIFICATE_PRIVATE_KEY（發佈憑證私鑰）放這個 group，要在 Codemagic UI 手動加。
      groups:
        - appstore_signing
      node: 22.14.0
      # Apple 強制要 iOS 26 SDK (Xcode 26+) 才能上傳 App Store Connect，
      # 用 latest 取最新穩定 Xcode（16.4=iOS18.5 SDK 會被退件）。
      xcode: latest
      # 簽章改在下面 script 用 xcodebuild 自動簽章 + App Store Connect API key 做。
      # managed ios_signing / xcode-project use-profiles 對 Capacitor 專案套不上 profile
      # （archive 用 Manual 卻沒 PROVISIONING_PROFILE_SPECIFIER → 失敗），已試過。
      vars:
        # Vite build 時 inline VITE_*；不設 BACKEND 會打 localhost:3001 全炸。
        VITE_BACKEND_URL: "https://api.examking.tw"
        # Supabase（anon key 是公開金鑰，本來就打包進前端）。沒設 → supabase=null
        # → Google 登入/帳號綁定整個被關掉。.env.local 沒 commit，CI 必須在這補。
        VITE_SUPABASE_URL: "https://qgysdulvntuesoacdszo.supabase.co"
        VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFneXNkdWx2bnR1ZXNvYWNkc3pvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzOTk1OTcsImV4cCI6MjA5MDk3NTU5N30.o5gxEWUheE3I7g7qg7xCUrLy18CadbzWpdg_e7mGjSU"
        # Phase 1 功能旗標：對齊網頁正式版（Vercel）— 頭像/感謝榜/徽章已開放；
        # 邊框/AI無限尚未正式放（不設＝OFF）。RANK_FRAMES 預設 ON 不用設。
        VITE_FEATURE_AVATARS: "1"
        VITE_FEATURE_SPONSORS: "1"
        VITE_FEATURE_BADGES: "1"
        # App Store Connect 數字 App ID（用來查/遞增 TestFlight build number）。
        APP_STORE_APP_ID: 6780595877
    cache:
      cache_paths:
        - $HOME/.npm
        - frontend/node_modules
        - frontend/ios/App/Pods
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci --no-audit --no-fund

      - name: Build web assets (vite)
        script: |
          npm run build

      - name: Add iOS platform (if missing)
        script: |
          if [ ! -d "ios" ]; then npx cap add ios; fi

      - name: Sync Capacitor → iOS
        script: |
          npx cap sync ios

      - name: Strip bundled question images (load from web instead)
        script: |
          # 同 Android：question-images + signs 改從 examking.tw 載入，不打包進 IPA。
          rm -rf ios/App/App/public/question-images
          rm -rf ios/App/App/public/signs
          echo "Stripped question-images + signs from iOS assets"

      - name: Inject real app icon (修 2.3.8：覆蓋 Capacitor 佔位 icon)
        script: |
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          echo "Before:"; ls "$ICONSET"
          rm -f "$ICONSET"/*.png
          cp resources/icon-1024.png "$ICONSET/icon-1024.png"
          # 單一 universal 1024 icon（Xcode 14+ 支援）→ 確定用到真 logo。
          printf '%s' '{"images":[{"filename":"icon-1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > "$ICONSET/Contents.json"
          echo "After:"; ls "$ICONSET"

      - name: Inject Info.plist keys (OAuth scheme + AdMob + ATT)
        script: |
          PLIST="ios/App/App/Info.plist"
          PB=/usr/libexec/PlistBuddy
          # ① Google 登入 deep-link：tw.examking.app:// 註冊在 CFBundleURLTypes，
          #    否則 iOS appUrlOpen 不觸發、登入轉不回 App（Android 已用 manifest 做）。
          $PB -c "Add :CFBundleURLTypes array" "$PLIST" 2>/dev/null || true
          $PB -c "Add :CFBundleURLTypes:0 dict" "$PLIST" 2>/dev/null || true
          $PB -c "Add :CFBundleURLTypes:0:CFBundleURLName string tw.examking.app" "$PLIST" 2>/dev/null || true
          $PB -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST" 2>/dev/null || true
          $PB -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string tw.examking.app" "$PLIST" 2>/dev/null || true
          # ② AdMob iOS App ID（admob.js IOS_ADMOB_APP_ID）— 缺這個看廣告會閃退/初始化失敗。
          $PB -c "Add :GADApplicationIdentifier string ca-app-pub-3134321405509741~8300987419" "$PLIST" 2>/dev/null \
            || $PB -c "Set :GADApplicationIdentifier ca-app-pub-3134321405509741~8300987419" "$PLIST"
          # ③ App 追蹤透明度說明（iOS 14+ 廣告個人化/過審用）。
          $PB -c "Add :NSUserTrackingUsageDescription string 本應用程式會使用識別碼來提供更相關的廣告。" "$PLIST" 2>/dev/null || true
          # ③-2 SKAdNetworkItems（iOS 14.5+ 廣告歸因）— 缺這個 AdMob 在 iOS 填充率/收益會大幅下降。
          #     清單為 Google Mobile Ads SDK 官方建議的 SKAdNetwork ID（Google 自家 cstr6suwn9 為首）。
          $PB -c "Delete :SKAdNetworkItems" "$PLIST" 2>/dev/null || true
          $PB -c "Add :SKAdNetworkItems array" "$PLIST" 2>/dev/null || true
          SKAN_IDS="cstr6suwn9 4fzdc2evr5 2u9pt9hc89 8s468mfl3y klf5c3l5u5 ppxm28t8ap v72qych5uu ludvb6z3bs cp8zw746q7 3sh42y64q3 c6k4g5qg8m s39g8k73mm 3qy4746246 f38h382jlk hs6bdukanm v4nxqhlyqp wzmmz9fp6w yclnxrl5pm t38b2kh725 7ug5zh24hu 9rd848q2bz n6fk4nfna4 kbd757ywx3 9t245vhmpl 4468km3ulz 2fnua5tdw4 ydx93a7ass 5a6flpkh64 p78axxw29g v9wttpbfk9 n38lu8286q"
          i=0
          for id in $SKAN_IDS; do
            $PB -c "Add :SKAdNetworkItems:$i dict" "$PLIST" 2>/dev/null || true
            $PB -c "Add :SKAdNetworkItems:$i:SKAdNetworkIdentifier string ${id}.skadnetwork" "$PLIST" 2>/dev/null || true
            i=$((i+1))
          done
          echo "Injected $i SKAdNetwork IDs"
          # ④ 出口合規：只用 HTTPS(豁免加密) → 宣告不含非豁免加密，省去每次 TestFlight 的加密聲明框。
          $PB -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null \
            || $PB -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          # ⑤ 繁體中文在地化：App Store 商品頁「語言」欄是依 binary 宣告的語言顯示，
          #    Capacitor 預設開發語言=en → 顯示 English。改成 zh-Hant + 宣告支援繁中。
          $PB -c "Set :CFBundleDevelopmentRegion zh-Hant" "$PLIST" 2>/dev/null \
            || $PB -c "Add :CFBundleDevelopmentRegion string zh-Hant" "$PLIST"
          $PB -c "Add :CFBundleLocalizations array" "$PLIST" 2>/dev/null || true
          $PB -c "Add :CFBundleLocalizations:0 string zh-Hant" "$PLIST" 2>/dev/null || true
          echo "=== Info.plist 注入結果 ==="; $PB -c "Print :CFBundleURLTypes" "$PLIST" || true; $PB -c "Print :GADApplicationIdentifier" "$PLIST" || true; $PB -c "Print :CFBundleDevelopmentRegion" "$PLIST" || true

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --repo-update

      - name: Auto-increment build number from TestFlight
        script: |
          cd ios/App
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
          NEW=$(($LATEST + 1))
          agvtool new-version -all "$NEW" || echo "agvtool skipped (build $NEW)"
          # 行銷版本號（CFBundleShortVersionString）= App Store 顯示的版本。
          # 1.0.3 已送審（build 12）。1.0.4 = 本次（暫停計時/跨裝置同步/同題只計一次/
          # 找類似題修復/年份題號）。下次改版手動 +1。
          agvtool new-marketing-version 1.0.5 || echo "marketing version skipped (1.0.4)"
          echo "Build number = $NEW, Marketing = 1.0.5"

      - name: Prepare distribution certificate in keychain
        script: |
          keychain initialize
          # fetch-signing-files 自己不產私鑰，必須提供一把。用 Codemagic env var
          # CERTIFICATE_PRIVATE_KEY（固定私鑰）→ 憑證固定重用、不會變孤兒、不卡 2 張上限。
          app-store-connect fetch-signing-files "tw.examking.app" \
            --type IOS_APP_STORE \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
            --create
          keychain add-certificates
          # 把下載好的描述檔套到 Xcode 專案（憑證+描述檔現在都有效，能正確套上）。
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          # 標準手動簽章打包：use-profiles 已把描述檔套上，憑證在 keychain。
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - aaowobbowocc@gmail.com
        notify:
          success: true
          failure: true

  # ════════════════════════════════════════════════════════════════════
  # Android AAB — 給 Play Console 內部測試 / 封閉測試 / 正式版上傳
  # ════════════════════════════════════════════════════════════════════
  android-aab:
    name: Android Signed AAB (Play Console)
    # mac_mini_m2 是 Codemagic 免費方案唯一可用 instance (500 min/月)，
    # linux_x2 / windows_x2 都要付費。Mac 跑 Gradle bundleRelease 沒問題。
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: frontend
    environment:
      node: 22.14.0
      # Capacitor 7 要 Java 21 (capacitor.build.gradle sourceCompatibility 21)
      java: 21
      android_signing:
        - examking_keystore
      vars:
        # Vite 在 build 時把 import.meta.env.VITE_* inline 進 bundle。
        # 不設這個 App 內所有 BACKEND 呼叫都會打 localhost:3001 → 全炸。
        VITE_BACKEND_URL: "https://api.examking.tw"
        # Supabase（anon key 公開）。沒設 → 登入/綁定被關掉。.env.local 沒 commit。
        VITE_SUPABASE_URL: "https://qgysdulvntuesoacdszo.supabase.co"
        VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFneXNkdWx2bnR1ZXNvYWNkc3pvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzOTk1OTcsImV4cCI6MjA5MDk3NTU5N30.o5gxEWUheE3I7g7qg7xCUrLy18CadbzWpdg_e7mGjSU"
        # Phase 1 功能旗標：對齊網頁正式版（頭像/感謝榜/徽章開；邊框/AI無限不設＝OFF）。
        VITE_FEATURE_AVATARS: "1"
        VITE_FEATURE_SPONSORS: "1"
        VITE_FEATURE_BADGES: "1"
    cache:
      cache_paths:
        - $HOME/.npm
        - frontend/node_modules
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - frontend/android/.gradle
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci --no-audit --no-fund

      - name: Build web assets (vite)
        script: |
          npm run build

      - name: Sync Capacitor → Android
        script: |
          npx cap sync android

      - name: Strip bundled question images (load from web instead)
        script: |
          # question-images (~261MB) + signs (~14MB) 改從 examking.tw 載入
          # （見 frontend/src/lib/assetUrl.js）。不打包進 APK → App 從 ~345MB
          # 瘦到 ~70MB。strip 必須在 cap sync 之後、bundleRelease 之前。
          rm -rf android/app/src/main/assets/public/question-images
          rm -rf android/app/src/main/assets/public/signs
          echo "Stripped question-images + signs from Android assets"

      - name: Build signed release AAB
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

    artifacts:
      # 路徑相對 working_directory (frontend/)，不要再加 frontend/ 前綴
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk

    publishing:
      email:
        recipients:
          - aaowobbowocc@gmail.com
        notify:
          success: true
          failure: true
