# Codemagic CI/CD — iOS build pipeline for Capacitor + Vite
#
# 目前用途：驗證 iOS build pipeline 可走通（unsigned archive）。
# 確認能 build 成功後再付 Apple Developer $99，加上簽名 + TestFlight 上傳。
#
# 觸發：手動觸發（Codemagic Dashboard 點 "Start new build"）。
#       之後可改 trigger: push + branch_patterns 自動跑。

workflows:
  ios-unsigned:
    name: iOS Unsigned Archive (validation)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: frontend
    environment:
      node: 22.14.0
      # Pin Xcode 16.4：Codemagic 預設用最新（26.x）會跑 Swift 6 嚴格 concurrency,
      # @capacitor-community/admob ^6.2.0 還是 Swift 5 程式碼，編不過。
      # 16.4 是 admob 已驗過的最後一個穩定 Xcode (iOS 18 SDK)。
      xcode: 16.4
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
    cache:
      cache_paths:
        - $HOME/.npm
        - frontend/node_modules
        - frontend/ios/App/Pods
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci --no-audit --no-fund

      - name: Build web assets (vite)
        script: |
          npm run build

      - name: Add iOS platform (if missing)
        script: |
          if [ ! -d "ios" ]; then
            echo "iOS platform not found, installing @capacitor/ios and adding…"
            npm install @capacitor/ios@^6.2.1 --no-save --no-audit --no-fund
            npx cap add ios
          else
            echo "iOS platform already exists"
          fi

      - name: Sync Capacitor → iOS
        script: |
          npx cap sync ios

      - name: Pin GoogleUserMessagingPlatform Pod to v2.x
        script: |
          # @capacitor-community/admob ^6.2.0 ConsentExecutor.swift uses legacy
          # UMP* class names (UMPConsentStatus / UMPConsentInformation / etc.).
          # CocoaPods pulls latest GoogleUserMessagingPlatform v3+ which renamed
          # everything (drop UMP prefix). Pin to 2.7.x to keep compatibility
          # until we upgrade Capacitor major to 7.
          #
          # 用 Ruby 精準匹配 target block 內的 `capacitor_pods` 呼叫 (有縮排),
          # 跳過頂層的 `def capacitor_pods` 函式定義 (沒縮排),避免把 pod 加進
          # 函式定義裡造成依賴解析錯亂。
          ruby <<'RUBY'
          path = 'ios/App/Podfile'
          src = File.read(path)
          # 匹配「至少 1 空白 + capacitor_pods + 行尾」,保留原縮排
          patched = src.sub(
            /^(\s+)capacitor_pods\s*$/,
            "\\1capacitor_pods\n\\1pod 'GoogleUserMessagingPlatform', '~> 2.7.0'"
          )
          if patched == src
            warn "[pin-ump] could not find indented capacitor_pods call — Podfile structure changed?"
            exit 1
          end
          File.write(path, patched)
          puts "--- Patched Podfile ---"
          puts patched
          RUBY

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --repo-update

      - name: Build unsigned iOS archive
        script: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $CM_BUILD_DIR/build/App.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - $CM_BUILD_DIR/build/App.xcarchive
      - $CM_BUILD_DIR/build/*.log

    publishing:
      email:
        recipients:
          - aaowobbowocc@gmail.com
        notify:
          success: true
          failure: true
