# Codemagic CI/CD — Capacitor + Vite (iOS + Android)
#
# Workflows:
#   ios-unsigned    — iOS .xcarchive (unsigned)，驗 iOS pipeline + 之後加簽名上 TestFlight
#   android-aab     — Android .aab (unsigned)，丟 Play Console 上架/封閉測試
#
# 觸發：push to master 自動跑 (Codemagic 預設行為)。
#       手動可在 Dashboard "Start new build" 選 workflow。

workflows:
  ios-unsigned:
    name: iOS Unsigned Archive (validation)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: frontend
    environment:
      node: 22.14.0
      # Pin Xcode 16.4：Capacitor 7 + admob 7.2 配 iOS 18 SDK 穩定組合,
      # 不用 Xcode 26 是因為它預設啟 Swift 6 嚴格 concurrency,
      # 第三方 plugin 還沒全部跟上。
      xcode: 16.4
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        # Vite 在 build 時把 import.meta.env.VITE_* inline 進 bundle。
        # 不設這個 App 內所有 BACKEND 呼叫都會打 localhost:3001 → 全炸。
        VITE_BACKEND_URL: "https://api.examking.tw"
    cache:
      cache_paths:
        - $HOME/.npm
        - frontend/node_modules
        - frontend/ios/App/Pods
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci --no-audit --no-fund

      - name: Build web assets (vite)
        script: |
          npm run build

      - name: Add iOS platform (if missing)
        script: |
          if [ ! -d "ios" ]; then
            echo "iOS platform not found, adding…"
            npx cap add ios
          else
            echo "iOS platform already exists"
          fi

      - name: Sync Capacitor → iOS
        script: |
          npx cap sync ios

      - name: Strip bundled question images (load from web instead)
        script: |
          # 同 Android：question-images + signs 改從 examking.tw 載入，不打包進 IPA。
          rm -rf ios/App/App/public/question-images
          rm -rf ios/App/App/public/signs
          echo "Stripped question-images + signs from iOS assets"

      - name: Install CocoaPods
        script: |
          cd ios/App
          # 確保拿最新 podspec (Capacitor 7 + admob 7 配套已自帶相容 UMP 3.x)
          pod install --repo-update

      - name: Build unsigned iOS archive
        script: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $CM_BUILD_DIR/build/App.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - $CM_BUILD_DIR/build/App.xcarchive
      - $CM_BUILD_DIR/build/*.log

    publishing:
      email:
        recipients:
          - aaowobbowocc@gmail.com
        notify:
          success: true
          failure: true

  # ════════════════════════════════════════════════════════════════════
  # Android AAB — 給 Play Console 內部測試 / 封閉測試 / 正式版上傳
  # ════════════════════════════════════════════════════════════════════
  android-aab:
    name: Android Signed AAB (Play Console)
    # mac_mini_m2 是 Codemagic 免費方案唯一可用 instance (500 min/月)，
    # linux_x2 / windows_x2 都要付費。Mac 跑 Gradle bundleRelease 沒問題。
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: frontend
    environment:
      node: 22.14.0
      # Capacitor 7 要 Java 21 (capacitor.build.gradle sourceCompatibility 21)
      java: 21
      android_signing:
        - examking_keystore
      vars:
        # Vite 在 build 時把 import.meta.env.VITE_* inline 進 bundle。
        # 不設這個 App 內所有 BACKEND 呼叫都會打 localhost:3001 → 全炸。
        VITE_BACKEND_URL: "https://api.examking.tw"
    cache:
      cache_paths:
        - $HOME/.npm
        - frontend/node_modules
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - frontend/android/.gradle
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci --no-audit --no-fund

      - name: Build web assets (vite)
        script: |
          npm run build

      - name: Sync Capacitor → Android
        script: |
          npx cap sync android

      - name: Strip bundled question images (load from web instead)
        script: |
          # question-images (~261MB) + signs (~14MB) 改從 examking.tw 載入
          # （見 frontend/src/lib/assetUrl.js）。不打包進 APK → App 從 ~345MB
          # 瘦到 ~70MB。strip 必須在 cap sync 之後、bundleRelease 之前。
          rm -rf android/app/src/main/assets/public/question-images
          rm -rf android/app/src/main/assets/public/signs
          echo "Stripped question-images + signs from Android assets"

      - name: Build signed release AAB
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

    artifacts:
      # 路徑相對 working_directory (frontend/)，不要再加 frontend/ 前綴
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk

    publishing:
      email:
        recipients:
          - aaowobbowocc@gmail.com
        notify:
          success: true
          failure: true
