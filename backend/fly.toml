# Fly.io 設定 — examking-tw backend
# 部署：fly launch（首次）或 fly deploy（後續）
# 啟動前要設 secrets，見 MIGRATION_FLY.md

app = "examking-backend"
primary_region = "nrt"  # 東京 — 對台灣使用者延遲最低（30-60ms）

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"      # 閒置時停機（省錢）
  auto_start_machines = true       # 有 request 自動起
  min_machines_running = 1         # 留一台常駐避免 cold start（PvP 連線會中斷）
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

# 健康檢查
[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"  # questions JSON ~100MB + V8 heap = ~250-300MB，512MB 充裕

# Persistent volume 不需要 — 所有資料在 Supabase / R2 / Cloudflare
