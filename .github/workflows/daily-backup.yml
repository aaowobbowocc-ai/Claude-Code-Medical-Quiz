name: Daily Supabase Backup

on:
  schedule:
    # Run daily at 18:00 UTC (02:00 Taiwan time, low traffic)
    - cron: '0 18 * * *'
  workflow_dispatch:    # allow manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install backend deps
        run: cd backend && npm ci --omit=dev

      - name: Run backup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd backend
          node scripts/backup-supabase.js --out=$GITHUB_WORKSPACE/_backup

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: _backup/
          retention-days: 30   # GitHub Actions auto-cleanup

      # Optional: push to a separate backup branch for git-tracked archive
      # (skip if you'd rather rely on Actions artifacts only)
