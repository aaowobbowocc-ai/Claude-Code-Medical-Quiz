name: Oracle Deploy

# 觸發條件：master 分支有任何 backend 改動
on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/oracle-deploy.yml'
  # 也支援手動觸發
  workflow_dispatch:

# 同一時間只跑一個 deploy（避免 git pull 撞期）
concurrency:
  group: oracle-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to Oracle VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 5m
          envs: GCP_SERVICE_ACCOUNT_JSON
          script: |
            set -e
            cd /home/ubuntu/app
            echo "=== git pull ==="
            git pull origin master
            cd backend
            # 只在 package-lock 變動時才重裝（省時間）
            if git diff HEAD@{1} HEAD --name-only | grep -q "backend/package"; then
              echo "=== package.json changed, npm ci ==="
              npm ci --omit=dev --no-audit --no-fund
            else
              echo "=== no dep change, skip npm ci ==="
            fi
            # === sync env vars (idempotent — only adds if missing) ===
            # Vertex AI Search 3 個 ID — datastore / engine 都是 project-scoped 非機密
            sync_env() {
              local key="$1" val="$2"
              if grep -q "^${key}=" .env 2>/dev/null; then
                sed -i "s|^${key}=.*|${key}=${val}|" .env
              else
                echo "${key}=${val}" >> .env
              fi
            }
            sync_env VERTEX_SEARCH_DATASTORE_ID quiz-questions_1779552554869
            sync_env VERTEX_SEARCH_ENGINE_ID  quiz-search_1779552716508
            sync_env VERTEX_SEARCH_LOCATION   global
            sync_env GOOGLE_APPLICATION_CREDENTIALS /home/ubuntu/app/backend/.gcp-key.json
            # === GCP service account key — write JSON to .gcp-key.json ===
            # GoogleAuth 預設讀 GOOGLE_APPLICATION_CREDENTIALS 指向的檔案
            # 把 GitHub Secret 的 JSON 內容寫成檔案（chmod 600 限本人讀寫）
            if [ -n "$GCP_SERVICE_ACCOUNT_JSON" ]; then
              echo "$GCP_SERVICE_ACCOUNT_JSON" > .gcp-key.json
              chmod 600 .gcp-key.json
              # 簡單 sanity check：合法 JSON 且包含 client_email
              if grep -q '"client_email"' .gcp-key.json; then
                echo "✓ .gcp-key.json synced ($(wc -c < .gcp-key.json) bytes)"
              else
                echo "✗ .gcp-key.json doesn't look like a service account JSON!"
                head -c 200 .gcp-key.json
                exit 1
              fi
            else
              echo "⚠ GCP_SERVICE_ACCOUNT_JSON secret not set — Vertex APIs will fail"
            fi
            echo "=== .env Vertex Search lines ==="
            grep '^VERTEX_SEARCH_\|^GOOGLE_APPLICATION' .env || echo "(none — sync failed)"
            echo "=== restart backend ==="
            sudo systemctl restart examking-backend
            sudo systemctl status examking-backend --no-pager | head -10
            echo "=== wait for backend ready (up to 60s) ==="
            for i in $(seq 1 60); do
              if curl -fs -m 2 http://localhost:3001/health > /dev/null 2>&1; then
                echo "✓ backend ready after ${i}s"
                break
              fi
              if [ $i -eq 60 ]; then
                echo "✗ HEALTH FAIL after 60s"
                sudo journalctl -u examking-backend --no-pager -n 30
                exit 1
              fi
              sleep 1
            done
            curl -fs http://localhost:3001/health
            echo
            echo "=== deploy ok ==="
